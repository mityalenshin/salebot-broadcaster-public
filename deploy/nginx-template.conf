# Шаблон nginx-конфига для production.
# Подставь свой домен вместо EXAMPLE.COM и положи в /etc/nginx/sites-available/EXAMPLE.COM
# затем `ln -s ... sites-enabled/`, `nginx -t`, `systemctl reload nginx`.
# SSL получается через certbot --nginx -d EXAMPLE.COM (он сам пропишет ssl_certificate).

server {
    server_name EXAMPLE.COM;

    root /var/www/EXAMPLE.COM;
    index index.html;

    # Webhook от SaleBot, дашборд и API — всё проксируется на webhook.py (waitress на 8080)
    location ~ ^/(webhook|dashboard|api/) {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    listen [::]:443 ssl ipv6only=on;
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/EXAMPLE.COM/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/EXAMPLE.COM/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = EXAMPLE.COM) {
        return 301 https://$host$request_uri;
    }
    listen 80;
    listen [::]:80;
    server_name EXAMPLE.COM;
    return 404;
}
