# Положить как /etc/ssh/sshd_config.d/01-disable-password.conf
# (имя обязательно с префиксом 01-, чтобы быть раньше 50-cloud-init.conf —
# в sshd при дублирующих настройках побеждает первое значение).
#
# Применение:
#   sshd -t && systemctl reload ssh
#
# Перед отключением пароля убедись что вход по ключу работает:
#   ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes user@host echo OK
PasswordAuthentication no
ChallengeResponseAuthentication no
KbdInteractiveAuthentication no
PubkeyAuthentication yes
